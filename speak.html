<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>🎙 다인에듀 말하기 리그 · 반 관리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f6f1e8;color:#1f2433;font-size:15px;line-height:1.55}
header{background:linear-gradient(135deg,#1f2433,#4a2d5e);color:#fff;padding:22px 20px 0}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px;font-weight:900;flex:1}
h1 small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
nav{display:flex;gap:4px;margin-top:18px}
nav button{border:0;background:transparent;color:rgba(255,255,255,.7);font:800 14px inherit;padding:11px 16px;border-radius:14px 14px 0 0;cursor:pointer}
nav button.on{background:#f6f1e8;color:#1f2433}
main{padding:20px}
.btn{border:1px solid #e4ddd0;background:#fff;color:#1f2433;border-radius:11px;padding:9px 13px;font:700 13px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b9ae9a}.btn.p{background:#1f2433;color:#fff;border-color:#1f2433}.btn.a{background:#e0386b;color:#fff;border-color:#e0386b}.btn.s{padding:6px 9px;font-size:12px}.btn.g{background:transparent;border-color:transparent}
.btn.w{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.card{background:#fff;border:1px solid #ece3d3;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 0 #eee4d2}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.seg{display:inline-flex;background:#ece4d5;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font:800 13px inherit;color:#6b6457;cursor:pointer}
.seg button.on{background:#fff;color:#1f2433;box-shadow:0 1px 3px rgba(0,0,0,.08)}
select,input{border:1px solid #e4ddd0;border-radius:11px;padding:9px 11px;font:600 14px inherit;background:#fff;color:#1f2433}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:#8a8170;font-weight:800;padding:8px 10px;border-bottom:2px solid #efe7d8;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:9px 10px;border-bottom:1px solid #f3ecdf;vertical-align:middle}
tr.me td{background:#fff4f6}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rk{font-weight:900;width:44px;text-align:center}
.tier{display:inline-block;font-weight:900;font-size:11.5px;border-radius:999px;padding:2px 9px;color:#fff}
.muted{color:#8a8170;font-size:13px}
.code{font:800 14px ui-monospace,monospace;background:#f1ebe0;border-radius:8px;padding:4px 8px}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cl{background:#fff;border:1px solid #ece3d3;border-radius:16px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cl:hover{border-color:#e0386b}.cl b{display:block;font-size:16px}
.msg{margin-top:10px;font-weight:700;color:#b3123a;background:#fff0f2;border-radius:10px;padding:9px 12px;font-size:13px}
.msg.ok{color:#0b6b3a;background:#e9f9f0}
.login{max-width:420px;margin:30px auto;text-align:center}
.login input{width:100%;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps div{background:#fff;border:1px solid #ece3d3;border-radius:16px;padding:14px}
.steps b{display:block;margin-bottom:4px}
.scroll{overflow:auto}
@media (max-width:640px){.hide-m{display:none}h1{font-size:20px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>🎙 다인에듀 말하기 리그<small>모든 어학 사이트의 말하기 연습 점수 · 반 순위 · 전체 리그</small></h1><div class="who" id="who"></div></div>
  <nav id="nav"></nav>
</div></header>
<main><div class="wrap" id="app"><div class="muted">불러오는 중…</div></div></main>
<script src="config.js"></script>
<script type="module">
const FBV = '10.12.2';
const [A, Au, F] = await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
  import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
]);
const cfg = window.SMC_CONFIG || {};
const app = A.getApps().find(a => a.name === 'smc') || A.initializeApp(cfg.firebase, 'smc');
const auth = Au.getAuth(app), db = F.getFirestore(app);
const admins = (cfg.adminEmails || []).map(e => e.toLowerCase());
const LANGS = { es: ['🇪🇸', '스페인어'], en: ['🇺🇸', '영어'], fr: ['🇫🇷', '프랑스어'], it: ['🇮🇹', '이탈리아어'], pt: ['🇧🇷', '포르투갈어'], ca: ['🏴', '카탈루냐어'], la: ['🏛️', '라틴어'], zh: ['🇨🇳', '중국어'], ja: ['🇯🇵', '일본어'], ar: ['🇸🇦', '아랍어'], ru: ['🇷🇺', '러시아어'], all: ['🌐', '모든 언어'] };
const TIERS = [[0, '브론즈', '#b4743c'], [50, '실버', '#8a94a6'], [150, '골드', '#d4a017'], [400, '플래티넘', '#2a9d8f'], [1000, '다이아', '#5b6cff']];
const tierOf = x => TIERS.reduce((t, r) => (x || 0) >= r[0] ? r : t, TIERS[0]);
const lvlOf = xp => Math.floor(Math.sqrt((xp || 0) / 20)) + 1;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => (n < 10 ? '0' : '') + n;
function weekKey(d = new Date()) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return 'w' + t.getUTCFullYear() + '_' + pad(Math.ceil(((t - y0) / 86400000 + 1) / 7)); }
function rid(n) { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => a[b % a.length]).join(''); }
const S = { tab: 'class', user: null, admin: false, mode: 'week', lang: 'all', rows: null, classes: null, sel: null, members: null, sort: 'wk', msg: '', authTab: 'in' };
const W = weekKey();
const $ = s => document.querySelector(s);

Au.onAuthStateChanged(auth, u => {
  S.user = u && (u.emailVerified || u.providerData.some(p => p.providerId === 'google.com')) ? u : null;
  S.unverified = u && !S.user ? u : null;
  S.admin = !!(S.user && admins.includes((S.user.email || '').toLowerCase()));
  S.rows = null; S.classes = null; S.members = null;
  const h = new URLSearchParams(location.hash.slice(1)); if (h.get('class')) { location.replace('room.html?room=' + encodeURIComponent(h.get('class').toUpperCase())); }
  render();
});

function render() {
  $('#who').innerHTML = S.user ? `${esc(S.user.email)}${S.admin ? ' · ⚙ 관리자' : ''} <button class="btn s w" data-a="logout">로그아웃</button>` : '';
  $('#nav').innerHTML = [['class', '👥 우리 반 (실시간)'], ['league', '🏆 전체 리그'], ['help', '📘 사용 안내']].map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
  const app = $('#app');
  if (S.tab === 'help') { app.innerHTML = vHelp(); return; }
  if (S.tab === 'class') { app.innerHTML = vRoom(); return; }
  if (!S.user) { app.innerHTML = vLogin(); return; }
  app.innerHTML = S.tab === 'league' ? vLeague() : vClass();
  if (S.tab === 'league' && !S.rows) loadLeague();
  if (S.tab === 'class' && !S.sel && !S.classes) loadClasses();
  if (S.tab === 'class' && S.sel && !S.members) loadMembers();
}
function vLogin() {
  if (S.unverified) return `<div class="card login"><b>이메일 인증이 필요해요</b><p class="muted">${esc(S.unverified.email)}로 보낸 인증 메일의 링크를 누른 뒤 아래 버튼을 눌러 주세요.</p><div class="row" style="justify-content:center"><button class="btn p" data-a="verified">인증 완료했어요</button><button class="btn" data-a="logout">로그아웃</button></div></div>`;
  return `<div class="card login"><div style="font-size:40px">🎙</div><h2 style="margin:6px 0">로그인</h2><p class="muted">다인에듀 학습 사이트와 같은 계정을 사용해요.</p>
    <button class="btn p" style="width:100%;justify-content:center" data-a="google">G&nbsp; Google 계정으로 로그인</button>
    <div class="seg" style="margin-top:14px"><button class="${S.authTab === 'in' ? 'on' : ''}" data-a="authTab" data-v="in">이메일 로그인</button><button class="${S.authTab === 'up' ? 'on' : ''}" data-a="authTab" data-v="up">가입</button></div>
    <input type="email" id="em" placeholder="이메일"><input type="password" id="pw" placeholder="비밀번호 (6자 이상)">
    <button class="btn a" style="width:100%;justify-content:center;margin-top:10px" data-a="email">${S.authTab === 'up' ? '가입하기' : '로그인'}</button>${S.msg ? `<div class="msg">${esc(S.msg)}</div>` : ''}</div>`;
}
function vRoom() {
  return `<div class="card"><h2 style="margin-top:0">👥 우리 반 — 로그인 없이 방 코드로 겨뤄요</h2>
    <p class="muted" style="margin-top:0">travel_spanish처럼 <b>이름 + 방 코드</b>만으로 반이 만들어지고, 같은 방 학생들의 말하기 점수가 실시간 순위표에 올라가요. 같은 방 코드는 모든 어학 사이트에서 함께 쓰여요.</p>
    <div class="row"><input id="rc" maxlength="12" placeholder="방 코드 (예: KCIS1A)" style="text-transform:uppercase;font-family:ui-monospace,monospace;font-weight:800;letter-spacing:.08em;flex:1;min-width:180px"><button class="btn" data-a="rnew">✨ 새 방 코드</button><button class="btn a" data-a="ropen">📺 대시보드 열기</button></div>
    ${S.msg ? `<div class="msg ${S.msgOk ? 'ok' : ''}">${esc(S.msg)}</div>` : ''}</div>
  <div class="steps"><div><b>1. 방 코드 정하기</b>위에서 새 방 코드를 만들거나 원하는 코드(영문·숫자 3~12자)를 정해요.</div>
    <div><b>2. 학생 입장</b>학생은 어학 사이트 오른쪽 <b>🎙 말하기 → 👥 우리 반</b>에서 이름과 방 코드를 입력해요. 사이트 주소 뒤에 <code>?room=방코드</code>를 붙인 링크·QR로 들어오면 코드가 자동으로 채워져요.</div>
    <div><b>3. 실시간 경쟁</b>말하기 점수가 바로 반 순위·실시간 피드·문장별 1등·인기 문장에 반영돼요. 📺 대시보드를 프로젝터에 띄워 두세요.</div>
    <div><b>4. 수업 전 초기화</b>패널의 👩‍🏫 선생님 도구에서 방 코드를 입력하면 그 방 기록을 지울 수 있어요.</div></div>`;
}
function vLeague() {
  const field = S.mode === 'week' ? '이번 주' : '누적';
  let h = `<div class="card"><div class="row"><div class="seg"><button class="${S.mode === 'week' ? 'on' : ''}" data-a="mode" data-v="week">이번 주 (${W.replace('w', '').replace('_', '년 ')}주)</button><button class="${S.mode === 'all' ? 'on' : ''}" data-a="mode" data-v="all">전체 누적</button></div>
    <select id="lang">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${S.lang === k ? 'selected' : ''}>${v[0]} ${k === 'all' ? '모든 언어 합계' : v[1]}</option>`).join('')}</select><span class="sp"></span><button class="btn s" data-a="reload">↻ 새로고침</button></div>
    <p class="muted" style="margin:10px 0 0">티어(이번 주 XP): ${TIERS.map(t => `<span class="tier" style="background:${t[2]}">${t[1]} ${t[0]}+</span>`).join(' ')} · 매주 월요일 새 시즌 ${S.lang !== 'all' && S.mode === 'week' ? '· 언어별 보기는 누적 XP 기준이에요' : ''}</p></div>`;
  if (!S.rows) return h + '<div class="muted">불러오는 중…</div>';
  if (S.rows.err) return h + `<div class="msg">순위를 불러오지 못했어요: ${esc(S.rows.err)} — Firestore 보안 규칙을 새로 게시했는지 확인하세요.</div>`;
  h += `<div class="card scroll"><table><thead><tr><th class="rk">#</th><th>이름</th><th>레벨</th><th class="hide-m">연습한 언어</th><th class="num">${S.lang === 'all' ? field : '누적'} XP</th><th class="num hide-m">연습</th><th class="num hide-m">평균</th><th class="num hide-m">🔥연속</th></tr></thead><tbody>`;
  h += S.rows.map((x, i) => `<tr class="${S.user && x.id === S.user.uid ? 'me' : ''}"><td class="rk">${['🥇', '🥈', '🥉'][i] || i + 1}</td><td><b>${esc(x.name)}</b> ${S.mode === 'week' && S.lang === 'all' ? `<span class="tier" style="background:${tierOf(x.v)[2]}">${tierOf(x.v)[1]}</span>` : ''}</td><td>Lv.${x.lvl || lvlOf(x.xp)}</td>
    <td class="hide-m">${Object.keys(x.lx || {}).filter(k => x.lx[k] > 0).map(k => (LANGS[k] || [''])[0]).join(' ')}</td><td class="num"><b>${x.v}</b></td><td class="num hide-m">${x.attempts || 0}</td><td class="num hide-m">${x.attempts ? Math.round((x.sumScore || 0) / x.attempts) : 0}</td><td class="num hide-m">${x.streak || 0}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">아직 기록이 없어요.</td></tr>';
  return h + '</tbody></table></div>';
}
async function loadLeague() {
  try {
    const field = S.lang !== 'all' ? 'lx.' + S.lang : S.mode === 'week' ? 'wk.' + W : 'xp';
    const qs = await F.getDocs(F.query(F.collection(db, 'speak_users'), F.orderBy(field, 'desc'), F.limit(100)));
    const rows = []; qs.forEach(d => { const x = d.data(); x.id = d.id; x.v = S.lang !== 'all' ? (x.lx || {})[S.lang] || 0 : S.mode === 'week' ? (x.wk || {})[W] || 0 : x.xp || 0; if (x.v > 0) rows.push(x); });
    S.rows = rows;
  } catch (e) { S.rows = { err: e.code || String(e) }; }
  render();
}
function vClass() {
  if (S.sel) return vMembers();
  let h = `<div class="card"><div class="row"><b style="font-size:17px">${S.admin ? '모든 반 (관리자)' : '내가 만든 반'}</b><span class="sp"></span><button class="btn s" data-a="reload">↻</button></div>
    <div class="row" style="margin-top:12px"><input id="cname" placeholder="새 반 이름 (예: KCIS 스페인어 1반)" maxlength="40" style="flex:1;min-width:200px"><select id="clang">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v[0]} ${k === 'all' ? '모든 언어 집계' : v[1] + ' 연습만 집계'}</option>`).join('')}</select><button class="btn a" data-a="create">+ 반 만들기</button></div>
    ${S.msg ? `<div class="msg ${S.msgOk ? 'ok' : ''}">${esc(S.msg)}</div>` : ''}</div>`;
  if (!S.classes) return h + '<div class="muted">불러오는 중…</div>';
  if (S.classes.err) return h + `<div class="msg">${esc(S.classes.err)}</div>`;
  h += S.classes.length ? `<div class="cls">${S.classes.map(c => `<button class="cl" data-a="open" data-v="${c.id}"><span style="font-size:26px">${(LANGS[c.lang] || ['🌐'])[0]}</span><b>${esc(c.name)}</b><span class="muted">${(LANGS[c.lang] || ['', c.lang])[1]} · 담당 ${esc(c.ownerName || '')}</span><div style="margin-top:8px"><span class="code">${c.id}</span></div></button>`).join('')}</div>`
    : '<div class="card muted">아직 만든 반이 없어요. 위에서 반을 만들고 학생에게 반 코드나 초대 링크를 알려 주세요.</div>';
  return h;
}
async function loadClasses() {
  try {
    const col = F.collection(db, 'speak_classes');
    const qs = await F.getDocs(S.admin ? F.query(col, F.limit(300)) : F.query(col, F.where('owner', '==', S.user.uid)));
    S.classes = []; qs.forEach(d => S.classes.push({ id: d.id, ...d.data() }));
    S.classes.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
  } catch (e) { S.classes = { err: e.code || String(e) }; }
  render();
}
function vMembers() {
  const c = S.cls || {}, own = S.admin || c.owner === S.user.uid;
  const invite = (site) => `https://yalli2.github.io/${site || ''}/?speakClass=${S.sel}`;
  let h = `<div class="card"><div class="row"><button class="btn s" data-a="back">← 반 목록</button><span class="sp"></span><button class="btn s" data-a="csv">⬇ CSV 내보내기</button><button class="btn s" data-a="reload">↻</button></div>
    <div class="row" style="margin-top:12px"><span style="font-size:30px">${(LANGS[c.lang] || ['🌐'])[0]}</span><div style="flex:1"><b style="font-size:19px">${esc(c.name || S.sel)}</b><div class="muted">${(LANGS[c.lang] || ['', c.lang || ''])[1]} · 담당 ${esc(c.ownerName || '')} · 멤버 ${Array.isArray(S.members) ? S.members.length : '…'}명</div></div><span class="code" style="font-size:18px">${S.sel}</span></div>
    <div class="row" style="margin-top:10px"><button class="btn s" data-a="copy" data-v="${S.sel}">📋 반 코드 복사</button>${c.site ? `<button class="btn s" data-a="copy" data-v="${invite(c.site)}">🔗 초대 링크 복사</button>` : ''}${own ? '<button class="btn s g" data-a="delCls" style="color:#b3123a">반 삭제</button>' : ''}</div>
    <p class="muted" style="margin:8px 0 0">학생은 어학 사이트 오른쪽의 <b>🎙 말하기</b> → <b>우리 반</b> 탭에서 반 코드를 입력하거나, 초대 링크로 들어오면 자동으로 가입돼요.</p></div>`;
  if (S.members === null || S.members === 'loading') return h + '<div class="muted">불러오는 중…</div>';
  if (S.members.err) return h + `<div class="msg">${esc(S.members.err)}</div>`;
  const key = { wk: m => (m.wk || {})[W] || 0, xp: m => m.xp || 0, att: m => m.attempts || 0, avg: m => m.attempts ? (m.sumScore || 0) / m.attempts : 0, perf: m => m.perfect || 0, st: m => m.streak || 0, name: m => m.name || '' }[S.sort];
  const rows = S.members.slice().sort((a, b) => S.sort === 'name' ? String(key(a)).localeCompare(String(key(b)), 'ko') : key(b) - key(a));
  const th = (k, t, cls = 'num') => `<th class="${cls}" data-a="sort" data-v="${k}">${t}${S.sort === k ? ' ▼' : ''}</th>`;
