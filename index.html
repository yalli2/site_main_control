<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--mute:#94a3b8;--line:#e6e9f0;--soft:#f8fafc;--pri:#4f46e5;--pri2:#eef2ff;--ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05)}
[data-theme=dark]{--bg:#0a0f1d;--card:#111a2d;--ink:#e6eaf5;--sub:#9aa6bd;--mute:#6b7891;--line:#22304a;--soft:#0e1627;--pri:#8b93ff;--pri2:#1c2350;--okb:#0f2e1c;--warnb:#33240b;--badb:#3a1414;--sh:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--pri);text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .lg{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.02em}.brand small{color:var(--sub);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--sub);font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--soft);color:var(--ink)}.nav.on{background:var(--pri2);color:var(--pri)}
.nav .i{width:20px;text-align:center}.nav .c{margin-left:auto;font-size:11px;background:var(--soft);color:var(--sub);border-radius:999px;padding:2px 8px}
.nav .c.hot{background:var(--bad);color:#fff}
.side-foot{margin-top:auto;font-size:11px;color:var(--mute);padding:10px 12px;line-height:1.6}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#top h1{font-size:18px;margin:0;letter-spacing:-.02em}
#top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--soft);color:var(--sub);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
#main{padding:22px 24px 60px;max-width:1500px;width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}.btn.ic{padding:6px 8px}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px 18px}.kpi .l{color:var(--sub);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px}.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
h3.t{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}h3.t .sp{flex:1}
.cols2{grid-template-columns:1.4fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.cols2,.cols3{grid-template-columns:1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.search:before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
select.f,input.f,textarea.f{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);max-width:100%}
textarea.f{width:100%;resize:vertical;line-height:1.5}input.f{width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 35%,transparent);outline-offset:0;border-color:var(--pri)}
table.tb{width:100%;border-collapse:separate;border-spacing:0}
.tb th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:hover td{background:var(--soft)}.tb tr.selr td{background:var(--pri2)}
.nm .t1{font-weight:700;line-height:1.3}.nm .t2{font-size:12px;color:var(--sub);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--soft);color:var(--sub);white-space:nowrap;border:1px solid var(--line)}
.tag.g{border:0;color:#fff}
.b-ok{color:var(--ok);background:var(--okb);border-color:transparent}.b-warn{color:var(--warn);background:var(--warnb);border-color:transparent}.b-bad{color:var(--bad);background:var(--badb);border-color:transparent}.b-pri{color:var(--pri);background:var(--pri2);border-color:transparent}
select.mode{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-weight:700;font-size:12px;background:var(--card);cursor:pointer}
select.mode.m-public{color:#16a34a}select.mode.m-members{color:#2563eb}select.mode.m-private{color:#7c3aed}select.mode.m-maintenance{color:#d97706}select.mode.m-closed{color:#dc2626}
.star{border:0;background:none;cursor:pointer;font-size:16px;opacity:.35;padding:2px}.star.on{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.scard{padding:14px;display:flex;flex-direction:column;gap:10px}
.scard .hd{display:flex;gap:8px;align-items:flex-start}.scard .hd .nm{flex:1;min-width:0}
.scard .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bulk{position:sticky;top:62px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.bulk .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff}.bulk select{background:#fff;color:#0f172a;border-radius:8px;border:0;padding:6px}
.muted{color:var(--sub)}.mute{color:var(--mute)}.small{font-size:12px}.b{font-weight:700}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}.empty .e{font-size:40px;margin-bottom:8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;position:relative}
.bars .seg{width:100%;border-radius:4px 4px 0 0;min-height:0}.bars .lb{font-size:10px;color:var(--mute);margin-top:4px}
.bars .col:hover .tip{display:block}.tip{display:none;position:absolute;bottom:100%;background:var(--ink);color:var(--card);font-size:11px;border-radius:6px;padding:4px 7px;white-space:nowrap;z-index:3}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0}.hbar .n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.hbar .tr{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.hbar .fl{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:99px}.hbar .v{width:36px;text-align:right;font-weight:700;font-size:12px}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.li:last-child{border:0}.li .g{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;border:0}.setup p{opacity:.9;line-height:1.6}.setup .btn{background:#fff;color:#4f46e5;border:0}
.steps{counter-reset:s;display:grid;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.step:before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.step.done:before{content:"✓";background:var(--ok)}.step .g{flex:1;min-width:0}.step b{display:block;margin-bottom:4px}
.step ol,.step ul{margin:6px 0 0;padding-left:18px;line-height:1.75;color:var(--sub);font-size:13px}
pre.code{background:#0b1020;color:#c7d2fe;border-radius:10px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;max-height:340px;margin:8px 0;white-space:pre}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.g{flex:1;min-width:0}
.fld{margin-bottom:12px}.fld>label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;background:var(--card)}
.chip input{display:none}.chip.on,.chip:has(input:checked){border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mcard{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--card);text-align:left}
.mcard .ic{font-size:20px}.mcard b{display:block;font-size:13px;margin-top:4px}.mcard small{color:var(--sub);font-size:11px;line-height:1.4;display:block;margin-top:2px}
.mcard.on{border-color:var(--pri);background:var(--pri2)}
.picker{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.picker .ph{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line);background:var(--soft);align-items:center;flex-wrap:wrap}
.picker .pb{max-height:260px;overflow:auto;padding:6px 10px}
.picker .pc{font-size:11px;font-weight:800;color:var(--sub);margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.picker label.pi{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:7px;cursor:pointer;font-size:13px}
.picker label.pi:hover{background:var(--soft)}.picker label.pi small{color:var(--mute);margin-left:auto;font-size:11px}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.12);z-index:60;transform:translateX(105%);transition:transform .25s ease;overflow:auto}
#drawer.open{transform:none}
#drawer .dh{position:sticky;top:0;background:var(--card);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
#drawer .db{padding:18px 20px}#drawer section{margin-bottom:22px}#drawer h4{font-size:13px;margin:0 0 10px;color:var(--sub);text-transform:none}
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:55;display:none}#scrim.on{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.modal{background:var(--card);border-radius:18px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:18px 20px;overflow:auto}.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tu .2s}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes tu{from{transform:translateY(8px);opacity:0}}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.prog>div{height:100%;background:var(--pri);transition:width .2s}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:13px;line-height:1.5}
.banner.warn{background:var(--warnb);color:var(--warn)}.banner.info{background:var(--pri2);color:var(--pri)}
.qr svg{width:220px;height:220px;display:block;margin:0 auto;background:#fff;padding:10px;border-radius:12px}
iframe.pv{width:100%;height:340px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hide-m{}
#menuBtn{display:none}
@media(max-width:860px){
  #side{position:fixed;left:0;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px rgba(0,0,0,.15)}#side.open{transform:none}
  #menuBtn{display:inline-flex}#main{padding:16px 12px 60px}#top{padding:10px 12px}.hide-m{display:none!important}
}

.mxc{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;color:#fff;font-size:14px}.mxc:hover{border-color:var(--pri)}.mxc.on{background:var(--ok);border-color:var(--ok)}
details>summary{list-style:revert}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card)}
</style>

<div id="app">
  <aside id="side">
    <div class="brand"><div class="lg">🛡️</div><div><b>Site Main Control</b><small>다인에듀 사이트 관리 콘솔</small></div></div>

    <div class="side-foot">github.com/<span id="ownerName">yalli2</span><br>단축키 <kbd>/</kbd> 검색 · <kbd>g</kbd>+<kbd>s</kbd> 사이트</div>

<script type="module">
/* ==========================================================================
   Site Main Control — 관리 콘솔
   ========================================================================== */
const RAW_CFG = window.SMC_CONFIG || {};
const OWNER = RAW_CFG.owner || 'yalli2';
const SELF = 'site_main_control';
const BASE_URL = `https://${OWNER}.github.io/${SELF}/`;
const GUARD_SRC = BASE_URL + 'guard.js';
const FBV = '10.12.2';
const CATALOG = window.SMC_CATALOG || {};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('sv-SE');
const addDays = (n, from) => { const d = from ? new Date(from) : new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const addMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return d.toLocaleDateString('sv-SE'); };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const pageUrl = name => `https://${OWNER}.github.io/${name}/`;
const tsDate = ts => ts ? (ts.toDate ? ts.toDate() : new Date(ts.seconds ? ts.seconds * 1000 : ts)) : null;
const fmtDT = ts => { const d = tsDate(ts); return d ? d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; };
const ago = ts => {
  const d = tsDate(ts); if (!d) return '—';
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  if (s < 86400 * 30) return Math.floor(s / 86400) + '일 전'; return d.toLocaleDateString('ko-KR');
};
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('ko-KR', { year: '2-digit', month: 'numeric', day: 'numeric' }) : '—';
const uniq = a => [...new Set(a)];

const MODES = {
  public: { ico: '🌐', label: '공개', desc: '누구나 접속 (로그인 없음)' },
  members: { ico: '👥', label: '회원 전체', desc: '등록된 활성 회원 누구나' },
  private: { ico: '🔒', label: '지정 회원만', desc: '권한 준 회원·그룹만' },
  maintenance: { ico: '🛠️', label: '점검 중', desc: '관리자만, 안내문 표시' },
  closed: { ico: '⛔', label: '차단', desc: '관리자 외 접속 불가' }
};
const CATS = {
  es: '🇪🇸 스페인어', en: '🇺🇸 영어', zh: '🇨🇳 중국어', ja: '🇯🇵 일본어', fr: '🇫🇷 프랑스어', lang: '🌍 기타 외국어',
  dainedu: '🏫 다인에듀 운영', hr: '💼 HR 프로그램', tools: '🧰 도구·연습', student: '🎓 학생·입시', life: '✈️ 생활·여행', etc: '📁 기타'
};
const GCOLORS = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#ef4444', '#8b5cf6', '#84cc16', '#0ea5e9', '#f97316'];
const RESULTS = { visit: ['방문', 'b-pri'], allowed: ['허용', 'b-ok'], admin: ['관리자', 'b-ok'], denied: ['거부', 'b-bad'] };
const REASONS = { notmember: '미등록 계정', suspended: '정지된 계정', expired: '기간 만료', nosite: '사이트 권한 없음', contract: '소속 계약 기간 외·정지' };

/* ---------------- 상태 ---------------- */
function loadCfg() {
  const c = JSON.parse(JSON.stringify(RAW_CFG));

const getToken = () => LS.get('smc:ghToken', '');
async function gh(path, opts = {}) {

  return gh(`/repos/${OWNER}/${repo}/contents/${encodeURIComponent(path)}`, { method: 'PUT', body: JSON.stringify({ message, content: b64enc(content), sha }) });
}
const GUARD_RE = /\n?[ \t]*<script[^>]*site_main_control\/guard\.js[^>]*><\/script>(?:<\!-- smc-guard -->)?/gi;

function addGuard(html, repo) {

  return insertTag(html, tag);

function insertTag(html, tag) {

}
const removeGuard = html => html.replace(GUARD_RE, '');
async function patchRepo(repo, remove = false, onFile) {
  const info = await gh(`/repos/${OWNER}/${repo}`);
  const branch = info.default_branch;
  const ref = await gh(`/repos/${OWNER}/${repo}/git/ref/heads/${encodeURIComponent(branch)}`);
  const commit = await gh(`/repos/${OWNER}/${repo}/git/commits/${ref.object.sha}`);
  const tree = await gh(`/repos/${OWNER}/${repo}/git/trees/${commit.tree.sha}?recursive=1`);

  const changes = [];
  for (const f of files) {
    const blob = await gh(`/repos/${OWNER}/${repo}/git/blobs/${f.sha}`);
    const text = b64dec(blob.content);
    const out = remove ? removeGuard(text) : addGuard(text, repo);

function filteredSites() {
  const f = S.f; const q = f.q.trim().toLowerCase(); const vb = visitsBySite(30);
  let list = allSites().map(s => ({ ...s, visits: vb[s.id] || 0 }));
  if (q) list = list.filter(s => (s.title + ' ' + s.name + ' ' + s.desc + ' ' + (s.doc.note || '')).toLowerCase().includes(q));
  if (f.cat !== 'all') list = list.filter(s => s.cat === f.cat);
  if (f.mode !== 'all') list = list.filter(s => f.mode === 'protected' ? s.mode !== 'public' : s.mode === f.mode);
  if (f.guard !== 'all') list = list.filter(s => f.guard === 'on' ? s.check.guard === true : f.guard === 'off' ? s.check.guard === false : s.check.guard === undefined);
  if (f.favOnly) list = list.filter(s => S.favs.has(s.id));
  const sorters = {
    pushed: (a, b) => (b.pushed || '').localeCompare(a.pushed || ''), name: (a, b) => a.title.localeCompare(b.title, 'ko'),
    created: (a, b) => (b.created || '').localeCompare(a.created || ''), visits: (a, b) => b.visits - a.visits, mode: (a, b) => Object.keys(MODES).indexOf(b.mode) - Object.keys(MODES).indexOf(a.mode)
  };
  list.sort(sorters[f.sort] || sorters.pushed);
  list.sort((a, b) => (S.favs.has(b.id) ? 1 : 0) - (S.favs.has(a.id) ? 1 : 0));
  return list;
}

/* ---------- 회원 ---------- */
function filteredUsers() {
  const f = S.uf, q = f.q.trim().toLowerCase(), d0 = today();
  let list = Object.entries(S.users).map(([email, u]) => ({ email, ...u }));
  if (q) list = list.filter(u => (u.email + ' ' + (u.name || '') + ' ' + (u.note || '')).toLowerCase().includes(q));
  if (f.group !== 'all') list = list.filter(u => f.group === 'none' ? !(u.groups || []).length : (u.groups || []).includes(f.group));
  if (f.org !== 'all') list = list.filter(u => f.org === 'none' ? !(u.orgs || []).length : (u.orgs || []).includes(f.org));
  if (f.status === 'active') list = list.filter(u => userState(u) === 'active');
  if (f.status === 'suspended') list = list.filter(u => u.status === 'suspended');
  if (f.status === 'expired') list = list.filter(u => userState(u) === 'expired');
  if (f.status === 'soon') list = list.filter(u => u.expiresAt && u.expiresAt >= d0 && u.expiresAt <= addDays(7));
  if (f.status === 'never') list = list.filter(u => !u.lastSeen);
  list.sort((a, b) => (b.lastSeen?.seconds || 0) - (a.lastSeen?.seconds || 0) || (a.name || a.email).localeCompare(b.name || b.email, 'ko'));
  return list;
}

const orgByName = n => (Object.entries(S.orgs).find(([, O]) => (O.name || '').trim().toLowerCase() === n.trim().toLowerCase()) || [])[0];
const groupByName = n => (Object.entries(S.groups).find(([, G]) => (G.name || '').trim().toLowerCase() === n.trim().toLowerCase()) || [])[0];
function parseCSV(txt) {
  const out = [], seen = new Set();
  (txt || '').split(/\r?\n/).forEach(line => {
    const cells = line.split(/[,\t;]/).map(c => c.trim().replace(/^"|"$/g, ''));
    const ei = cells.findIndex(c => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)); if (ei < 0) return;
    const email = cells[ei].toLowerCase(); if (seen.has(email)) return; seen.add(email);
    const rest = cells.filter((_, i) => i !== ei);
    out.push({ email, name: rest[0] || '', group: rest[1] || '', org: rest[2] || '' });
  });
  return out;
}

function holdersOf(kind, id) {

  const f = obj => Object.entries(obj).filter(([, h]) => (h[key] || []).includes(id)).map(([k]) => k);
  return { orgs: f(S.orgs), groups: f(S.groups), users: f(S.users) };
}
function reachOf(kind, id) {

  return { ...h, people: [...set].filter(e => userState(S.users[e]) === 'active').length };
}

function mxToggle(keys, forceVal) {

      ${periodFields('', '', '시작일 ~ 종료일 (업체·그룹은 시작·종료, 회원은 종료일만 적용)')}</div></div>

  const read = bg => ({
    orgs: pickedValues(bg, 'w_orgs'), groups: pickedValues(bg, 'w_groups'), emails: parseEmails(($('#w_emails', bg) || {}).value),

  });
  const preview = bg => {
    const r = read(bg); const people = new Set(r.emails);
    r.orgs.forEach(o => orgMembers(o).forEach(e => people.add(e))); r.groups.forEach(g => groupMembers(g).forEach(e => people.add(e)));
    const sites = uniq([...r.sites, ...resolvePkgSites(r)]);
    const nT = r.orgs.length + r.groups.length + r.emails.length;
    $('#w_prev', bg).innerHTML = nT ? `대상 <b>${nT}곳</b> (업체 ${r.orgs.length} · 그룹 ${r.groups.length} · 회원 ${r.emails.length}) → 영향받는 회원 약 <b>${people.size}명</b>` +
      (mode === 'period' ? '' : `<br>${mode === 'remove' ? '회수' : '승인'}: 패키지 ${r.packages.length} · 프로그램 ${r.programs.length} · 사이트 ${r.sites.length} → 사이트 총 <b>${sites.length}개</b>`) +
      (r.setPeriod ? `<br>기간: ${r.startsAt || '(시작일 없음)'} ~ ${r.expiresAt || '무기한'}` : '') : '대상을 하나 이상 골라 주세요.';
  };
  await modal({
    title: titles[mode], body, wide: true,
    onOpen: bg => { bindModalHelpers(bg); bg.addEventListener('change', () => preview(bg)); bg.addEventListener('input', () => preview(bg)); bg.addEventListener('click', e => { if (e.target.closest('[data-setexp],[data-act^=pick]')) setTimeout(() => preview(bg), 0); }); },
    actions: [{ label: '취소', value: null }, {
      label: titles[mode].slice(2).trim() + ' 실행', cls: mode === 'remove' ? 'bad' : 'pri', run: async bg => {

        if (mode !== 'period' && !(r.packages.length + r.programs.length + r.sites.length)) { toast('승인할 내용을 골라 주세요', 'bad'); return false; }
        if (mode === 'replace' && !(await confirmBox(`${nT}곳의 승인 내용을 선택한 항목으로 <b>완전히 교체</b>할까요?`, '교체', 'bad'))) return false;
        const action = mode === 'period' ? null : mode;
        const ops = [];
        const patch = (cur, isUser) => ({ ...(action ? grantPatch(cur, r, action) : {}), ...(r.setPeriod ? (isUser ? { expiresAt: r.expiresAt } : { startsAt: r.startsAt, expiresAt: r.expiresAt }) : {}) });
        r.orgs.forEach(o => ops.push(['orgs', o, patch(S.orgs[o])]));
        r.groups.forEach(g => ops.push(['groups', g, patch(S.groups[g])]));
        r.emails.forEach(e => { const u = S.users[e]; if (u) ops.push(['users', e, patch(u, true)]); else if (mode !== 'remove') ops.push(['users', e, { ...newUserDoc(e), ...patch({}, true) }, true]); });
        await commitOps(ops); toast(`${titles[mode]} 완료 — ${ops.length}곳 반영`, 'ok');
      }
    }]
  });
}

async function approveRequest(rid, groupId, orgId) {
  if (!needAdmin()) return;
  const r = S.requests.find(x => x.id === rid); if (!r) return;
  const { F, db } = S.fb; const ex = S.users[r.email];
  const patch = { status: 'active', updatedAt: F.serverTimestamp() };
  if (orgId) patch.orgs = F.arrayUnion(orgId); else if (groupId) patch.groups = F.arrayUnion(groupId); else patch.sites = F.arrayUnion(r.site);
  if (r.reason === 'expired' && ex && ex.expiresAt && ex.expiresAt < today()) patch.expiresAt = addMonths(1);
  if (ex) await F.updateDoc(F.doc(db, 'users', r.email), patch);
  else await F.setDoc(F.doc(db, 'users', r.email), { ...newUserDoc(r.email), name: r.name || '', orgs: orgId ? [orgId] : [], groups: groupId ? [groupId] : [], sites: groupId || orgId ? [] : [r.site], createdAt: F.serverTimestamp() });
  await F.deleteDoc(F.doc(db, 'requests', rid));
  toast(`✅ ${r.name || r.email} 승인${r.reason === 'expired' ? ' (만료일 +1개월)' : ''}`, 'ok');
}

function rulesText(admins) {
  const list = (admins && admins.length ? admins : ['관리자이메일@gmail.com']).map(e => `'${e}'`).join(', ');
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function verified() { return signedIn() && request.auth.token.email_verified == true; }
    function myEmail()  { return request.auth.token.email.lower(); }
    function isAdmin()  { return verified() && myEmail() in [${list}]; }

    // 사이트 정책: 누구나 읽기(가드가 확인), 관리자만 쓰기
    match /sites/{site} {
      allow read: if true;
      allow write: if isAdmin();
    }
    // 업체(기관 계약): 관리자 + 그 업체 소속 회원만 읽기(가드가 확인), 관리자 쓰기
    match /orgs/{o} {
      allow get: if isAdmin() || (verified() && o in get(/databases/$(database)/documents/users/$(myEmail())).data.get('orgs', []));
      allow list, write: if isAdmin();
    }
    // 직접 만든 패키지: 관리자 전용
    match /packages/{p} {
      allow read, write: if isAdmin();
    }
    // 그룹: 인증된 회원 읽기, 관리자 쓰기
    match /groups/{g} {
      allow read: if verified();
      allow write: if isAdmin();
    }
    // 회원: 본인 문서만 읽기, 본인은 접속 시각만 갱신
    match /users/{email} {
      allow read: if isAdmin() || (verified() && myEmail() == email);
      allow create, delete: if isAdmin();
      allow update: if isAdmin() || (verified() && myEmail() == email
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['lastSeen', 'lastSite', 'visits']));
    }
    // 접속 기록: 누구나 형식에 맞게 추가, 관리자만 읽기·삭제
    match /logs/{id} {
      allow read, delete: if isAdmin();
      allow create: if request.resource.data.keys().hasOnly(['site', 'path', 'email', 'result', 'reason', 'ts', 'ua', 'ref'])
        && request.resource.data.site is string && request.resource.data.site.size() < 100
        && request.resource.data.path is string && request.resource.data.path.size() < 300
        && request.resource.data.result in ['visit', 'allowed', 'denied', 'admin']
        && (request.resource.data.email == 'anonymous' || (signedIn() && request.resource.data.email == myEmail()));
    }
    // 접근 요청: 인증된 본인만 생성, 관리자 처리
    match /requests/{id} {
      allow read, update, delete: if isAdmin();
      allow create: if verified() && request.resource.data.email == myEmail()
        && request.resource.data.message.size() <= 300;
    }
    // 🎙 말하기 연습(speak.js): 점수 — 본인만 쓰기(한 번에 +300 XP 이내), 로그인 회원은 순위표로 읽기
    function speakName() { return request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 40; }
    function speakOk(prev) { return speakName() && request.resource.data.xp is int
      && request.resource.data.xp >= prev && request.resource.data.xp - prev <= 300; }
    match /speak_users/{uid} {
      allow read: if signedIn();
      allow create: if verified() && request.auth.uid == uid && speakOk(0);
      allow update: if verified() && request.auth.uid == uid && speakOk(resource.data.get('xp', 0));
      allow delete: if isAdmin() || (signedIn() && request.auth.uid == uid);
    }
    // 🎙 말하기 반: 인증 회원 누구나 만들기, 만든 사람·관리자만 수정·삭제
    match /speak_classes/{code} {
      allow read: if signedIn();
      allow create: if verified() && code.matches('^[A-Z0-9]{6}$')
        && request.resource.data.owner == request.auth.uid && speakName();
      allow update: if verified() && (resource.data.owner == request.auth.uid || isAdmin())
        && request.resource.data.owner == resource.data.owner && speakName();
      allow delete: if verified() && (resource.data.owner == request.auth.uid || isAdmin());
      match /members/{uid} {
        allow read: if signedIn();
        allow create: if verified() && request.auth.uid == uid
          && exists(/databases/$(database)/documents/speak_classes/$(code))
          && request.resource.data.xp == 0 && speakName();
        allow update: if verified() && request.auth.uid == uid && speakOk(resource.data.get('xp', 0));
        allow delete: if verified() && (request.auth.uid == uid || isAdmin()
          || get(/databases/$(database)/documents/speak_classes/$(code)).data.owner == request.auth.uid);
      }
    }
  }
}`;
}

function parseFbConfig(txt) {
  const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
  const o = {};
  keys.forEach(k => { const m = txt.match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']+)["\']')); if (m) o[k] = m[1]; });
  return o.apiKey && o.projectId ? o : null;
}

    </div></div>

  <div class="card pad"><h3 class="t">③ Firestore 보안 규칙<span class="sp"></span><button class="btn sm" data-act="copyRules">📋 복사</button><a class="btn sm" href="${con('firestore/rules')}" target="_blank" rel="noopener">규칙 화면 열기 ↗</a></h3>

  <div class="card pad"><h3 class="t">④ GitHub 토큰 ${tok ? '<span class="tag b-ok">등록됨</span>' : ''}</h3>

const ACT = {
  nav: el => go(el.dataset.v), menu: () => $('#side').classList.toggle('open'),
  theme: () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; LS.set('smc:theme', t); renderTop(); },
  login: async () => {
    if (!S.fb) return go('setup');
    const { Au, auth } = S.fb;
    const r = await modal({
      title: '🔐 관리자 로그인', body: `<button class="btn pri" style="width:100%;justify-content:center;padding:12px" data-x="google">Google 계정으로 로그인</button>
        <div class="small muted" style="text-align:center;margin:14px 0 8px">또는 이메일/비밀번호</div><input class="f" id="l_em" type="email" placeholder="이메일" style="margin-bottom:8px"><input class="f" id="l_pw" type="password" placeholder="비밀번호">`,
      onOpen: bg => bg.querySelector('[data-x=google]').onclick = async () => {
        try { const p = new Au.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await Au.signInWithPopup(auth, p); bg.remove(); }
        catch (e) { toast(e.code === 'auth/unauthorized-domain' ? `Firebase 승인된 도메인에 ${location.hostname}을(를) 추가하세요` : e.message, 'bad'); }
      },
      actions: [{ label: '취소', value: null }, { label: '이메일로 로그인', cls: 'pri', run: async bg => { await Au.signInWithEmailAndPassword(auth, $('#l_em', bg).value.trim(), $('#l_pw', bg).value); } }]
    });
    return r;
  },
  logout: () => S.fb && S.fb.Au.signOut(S.fb.auth),
  // 사이트 목록
  sel: (el, e) => { e.stopPropagation(); const id = el.dataset.id; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); },
  selAll: () => { const l = filteredSites(); const all = l.every(s => S.sel.has(s.id)); l.forEach(s => all ? S.sel.delete(s.id) : S.sel.add(s.id)); render(); },
  selNone: () => { S.sel.clear(); render(); },

  favOnly: () => { S.f.favOnly = !S.f.favOnly; render(); },
  layout: () => { S.f.layout = S.f.layout === 'table' ? 'cards' : 'table'; LS.set('smc:layout', S.f.layout); render(); },
  reloadRepos: () => loadRepos(true),
  checkAll: () => runChecks(pagesSites()),
  bulkCheck: () => runChecks([...S.sel].map(id => S.repos.find(r => r.id === id)).filter(Boolean)),
  bulkGuard: () => guardBulk([...S.sel]), bulkUnguard: () => guardBulk([...S.sel], true),
  bulkLinks: () => copy([...S.sel].map(id => { const s = siteById(id); return `${s.title}\n${pageUrl(s.name)}`; }).join('\n\n'), `${S.sel.size}개 링크 복사`),
  copyLink: el => copy(pageUrl(siteById(el.dataset.id).name), '링크 복사'),
  copySnippet: el => copy(guardTag(siteById(el.dataset.id).name), '가드 코드 복사'),
  notice: el => copy(studentNotice(siteById(el.dataset.id)), '학생 안내문 복사'),
  qr: el => { const s = siteById(el.dataset.id); modal({ title: '▣ ' + esc(s.title), body: `<div class="qr">${qrSvg(pageUrl(s.name))}</div><p style="text-align:center;word-break:break-all" class="small">${pageUrl(s.name)}</p>`, actions: [{ label: '전체 화면', run: bg => { const q = $('.qr', bg); q.requestFullscreen ? q.requestFullscreen() : null; return false; } }, { label: '닫기', value: null, cls: 'pri' }] }); },
  open: el => openDrawer(el.dataset.id), closeDrawer,

  dSave: async () => {

  },
  dGroup: async el => {
    if (!needAdmin()) return; const gid = el.dataset.g, sid = S.drawer.id; const G = S.groups[gid]; const on = (G.sites || []).includes(sid);

  },

  dGuard: () => guardBulk([S.drawer.id]), dUnguard: () => guardBulk([S.drawer.id], true),
  dCheck: async () => { const r = S.repos.find(x => x.id === S.drawer.id); if (r) { await checkOne(r); LS.set('smc:checks', S.checks); render(); toast('점검 완료', 'ok'); } },

  delUser: async el => { if (!needAdmin()) return; if (await confirmBox(`<b>${esc(el.dataset.id)}</b> 회원을 삭제할까요?<br><span class="small muted">로그인 계정 자체는 남지만 모든 권한이 사라져요.</span>`, '삭제', 'bad')) { await fx().deleteDoc(dref('users', el.dataset.id)); toast('삭제했어요', 'ok'); } },
  extend: async el => { if (!needAdmin()) return; const u = S.users[el.dataset.id]; const base = u.expiresAt && u.expiresAt > today() ? u.expiresAt : today(); const d = new Date(base); d.setMonth(d.getMonth() + (+el.dataset.m || 1)); await fx().updateDoc(dref('users', el.dataset.id), { expiresAt: d.toLocaleDateString('sv-SE') }); toast('만료일 연장', 'ok'); },
  exportUsers: () => { const rows = [['email', 'name', 'groups', 'sites', 'allSites', 'status', 'expiresAt', 'lastSeen', 'note']]; Object.entries(S.users).forEach(([e, u]) => rows.push([e, u.name || '', (u.groups || []).map(g => S.groups[g]?.name || g).join('|'), (u.sites || []).join('|'), u.allSites ? 'Y' : '', u.status || 'active', u.expiresAt || '', u.lastSeen ? tsDate(u.lastSeen).toISOString() : '', u.note || ''])); download(`members_${today()}.csv`, toCSV(rows), 'text/csv'); },
  grantFromLog: async el => { if (!needAdmin()) return; const e = el.dataset.email, sid = el.dataset.site, { F, db } = S.fb; if (S.users[e]) await F.updateDoc(F.doc(db, 'users', e), { sites: F.arrayUnion(sid), status: 'active' }); else await F.setDoc(F.doc(db, 'users', e), { email: e, name: '', groups: [], sites: [sid], status: 'active', expiresAt: '', createdAt: F.serverTimestamp() }); toast(`✅ ${e} → ${siteTitle(sid)} 허용`, 'ok'); },
  // 그룹
  addGroup: () => groupModal(), editGroup: el => groupModal(el.dataset.id),
  delGroup: async el => { if (!needAdmin()) return; const G = S.groups[el.dataset.id]; if (!(await confirmBox(`<b>${esc(G.name)}</b> 그룹을 삭제할까요?<br><span class="small muted">회원은 남고, 그룹을 통한 권한만 사라져요.</span>`, '삭제', 'bad'))) return; const { F, db } = S.fb; const batch = F.writeBatch(db); Object.entries(S.users).filter(([, u]) => (u.groups || []).includes(el.dataset.id)).forEach(([e]) => batch.update(F.doc(db, 'users', e), { groups: F.arrayRemove(el.dataset.id) })); batch.delete(F.doc(db, 'groups', el.dataset.id)); await batch.commit(); toast('삭제했어요', 'ok'); },
  groupLinks: el => { const G = S.groups[el.dataset.id]; const ids = G.allSites ? pagesSites().map(s => s.id) : (G.sites || []); copy(`📚 ${G.name} 학습 사이트\n\n` + ids.map(id => { const s = siteById(id); return `• ${s.title}\n  ${pageUrl(s.name)}`; }).join('\n') + '\n\n처음 열면 선생님께 알려드린 이메일로 로그인하세요.', '링크 모음 복사'); },
  // 업체·패키지·일괄 승인
  addOrg: () => orgModal(), editOrg: el => orgModal(el.dataset.id),
  delOrg: async el => {
    if (!needAdmin()) return; const id = el.dataset.id, O = S.orgs[id], mem = orgMembers(id);
    if (!(await confirmBox(`<b>${esc(O.name)}</b> 업체를 삭제할까요?<br><span class="small muted">소속 회원 ${mem.length}명은 남고, 업체를 통한 권한만 사라져요. 잠시 멈추려면 삭제 대신 ⏸ 일시 정지를 쓰세요.</span>`, '삭제', 'bad'))) return;
    const { F, db } = S.fb; const b = F.writeBatch(db); mem.forEach(e => b.update(F.doc(db, 'users', e), { orgs: F.arrayRemove(id) })); b.delete(F.doc(db, 'orgs', id)); await b.commit(); toast('삭제했어요', 'ok');
  },
  orgToggle: async el => { if (!needAdmin()) return; const O = S.orgs[el.dataset.id]; const s = O.status === 'paused' ? 'active' : 'paused'; await fx().updateDoc(dref('orgs', el.dataset.id), { status: s }); toast(s === 'paused' ? `⏸ ${O.name} 이용 일시 정지 (소속 회원 접속 차단)` : `▶ ${O.name} 이용 재개`, 'ok'); },
  orgExtend: async el => { if (!needAdmin()) return; const O = S.orgs[el.dataset.id]; await fx().updateDoc(dref('orgs', el.dataset.id), { expiresAt: extendDate(O.expiresAt, +el.dataset.m || 1) }); toast(`${O.name} 기간 연장`, 'ok'); },
  orgMembers: el => { S.uf.org = el.dataset.id; S.uf.group = 'all'; S.uf.status = 'all'; go('users'); },
  orgNotice: el => copy(orgNotice(el.dataset.id), '업체 안내문 복사'),
  osel: (el, e) => { e.stopPropagation(); const id = el.dataset.id; S.osel.has(id) ? S.osel.delete(id) : S.osel.add(id); render(); },
  oselAll: () => { const l = filteredOrgs(); const all = l.every(o => S.osel.has(o.id)); l.forEach(o => all ? S.osel.delete(o.id) : S.osel.add(o.id)); render(); },
  oselNone: () => { S.osel.clear(); render(); },
  exportOrgs: () => { const rows = [['name', 'type', 'status', 'state', 'startsAt', 'expiresAt', 'seats', 'members', 'packages', 'programs', 'sites', 'contact', 'email', 'phone', 'note']]; Object.entries(S.orgs).forEach(([id, O]) => rows.push([O.name, ORG_TYPES[O.type || 'etc'], O.status || 'active', ORG_STATES[orgState(O)][0], O.startsAt || '', O.expiresAt || '', O.seats || '', orgMembers(id).length, (O.packages || []).map(p => (pkgById(p) || { name: p }).name).join('|'), (O.programs || []).join('|'), holderSiteCount(O), O.contact || '', O.email || '', O.phone || '', O.note || ''])); download(`orgs_${today()}.csv`, toCSV(rows), 'text/csv'); },
  pkTab: el => { S.pkTab = el.dataset.v; render(); },
  addPkg: () => pkgModal(), editPkg: el => pkgModal(el.dataset.id),
  delPkg: async el => {
    if (!needAdmin()) return; const id = el.dataset.id; const hs = holdersOf('pkg', id); const n = hs.orgs.length + hs.groups.length + hs.users.length;
    if (!(await confirmBox(`<b>${esc(S.cpkgs[id].name)}</b> 패키지를 삭제할까요?${n ? `<br><span class="small muted">승인받은 ${n}곳에서 이 패키지 권한이 함께 회수돼요.</span>` : ''}`, '삭제', 'bad'))) return;
    const ops = []; [['org', S.orgs, hs.orgs], ['group', S.groups, hs.groups], ['user', S.users, hs.users]].forEach(([k, src, ids]) => ids.forEach(x => ops.push([HOLDER_COL[k], x, grantPatch(src[x], { packages: [id] }, 'remove')])));
    if (ops.length) await commitOps(ops); await fx().deleteDoc(dref('packages', id)); toast('삭제했어요', 'ok');
  },
  pkgLinks: el => { const p = pkgById(el.dataset.id); copy(`📦 ${pkgLabel(p)}\n\n` + pkgRepos(p).map(r => `• ${siteTitle(r)}\n  ${pageUrl(siteById(r).name)}`).join('\n'), '패키지 링크 모음 복사'); },
  targets: el => targetsModal(el.dataset.k, el.dataset.id),
  recalcAll: async () => { if (needAdmin()) await recalcHolders(() => true, false); },
  wizard: el => wizardModal(el.dataset.m),
  mxTab: el => { S.mxTab = el.dataset.v; render(); },
  mxCell: el => mxToggle([el.dataset.k]),
  mxRow: el => mxToggle(allPackages().map(p => `${S.mxTab}|${el.dataset.id}|${p.id}`)),
  mxCol: el => mxToggle(Object.keys(S.mxTab === 'org' ? S.orgs : S.groups).map(hid => `${S.mxTab}|${hid}|${el.dataset.id}`)),
  mxReset: () => { S.mx = {}; render(); }, mxApply: () => mxApply(),
  // 요청
  reqApprove: el => approveRequest(el.dataset.id),
  reqDeny: async el => { if (!needAdmin()) return; await fx().deleteDoc(dref('requests', el.dataset.id)); toast('거절했어요'); },
  reqApproveAll: async () => { if (!(await confirmBox(`${S.requests.length}건을 모두 승인할까요?`, '모두 승인'))) return; for (const r of [...S.requests]) await approveRequest(r.id); },
  // 기록
  reloadLogs: () => loadLogs(), moreLogs: () => { S.logLimit += 500; render(); },
  exportLogs: () => { const rows = [['time', 'result', 'site', 'email', 'path', 'reason', 'ua']]; S.logs.forEach(l => rows.push([tsDate(l.ts)?.toISOString() || '', l.result, l.site, l.email, l.path, l.reason || '', l.ua || ''])); download(`access_logs_${today()}.csv`, toCSV(rows), 'text/csv'); },
  purgeLogs: async () => {
    if (!needAdmin()) return;
    const days = await modal({ title: '🧹 오래된 기록 정리', body: '<p style="margin-top:0">며칠보다 오래된 기록을 삭제할까요? (무료 한도 절약)</p><select class="f" id="pd"><option value="30">30일</option><option value="90" selected>90일</option><option value="180">180일</option></select>', actions: [{ label: '취소', value: null }, { label: '삭제', cls: 'bad', run: bg => +$('#pd', bg).value }] });
    if (!days) return; const { F, db } = S.fb; let total = 0;
    while (true) {
      const s = await F.getDocs(F.query(F.collection(db, 'logs'), F.where('ts', '<', F.Timestamp.fromDate(new Date(Date.now() - days * 864e5))), F.limit(400)));
      if (s.empty) break; const b = F.writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); await b.commit(); total += s.size;
    }
    toast(`🧹 ${total}건 삭제`, 'ok'); loadLogs();
  },
  // 설정
  testConfig: () => { const c = readSetupForm(); if (!c) return; LS.set('smc:cfgDraft', c); toast('🧪 테스트 설정 저장 — 새로고침합니다', 'ok'); setTimeout(() => location.reload(), 700); },
  clearDraft: () => { LS.del('smc:cfgDraft'); location.reload(); },
  copyConfig: () => { const c = readSetupForm(true) || S.cfg; copy(buildConfigJs(c), 'config.js 내용 복사 — GitHub에서 붙여 넣으세요'); },
  saveConfig: async () => {
    const c = readSetupForm(); if (!c) return;
    try { await putFile(SELF, 'config.js', buildConfigJs(c), 'Site Main Control 설정 저장'); LS.del('smc:cfgDraft'); await modal({ title: '✅ 저장 완료', body: '<p style="line-height:1.7;margin:0">config.js를 GitHub에 저장했어요. <b>1~2분 뒤</b> 모든 사이트에 반영돼요.<br>이제 ③ 보안 규칙을 Firebase에 게시하고 관리자 로그인을 해 주세요.</p>', actions: [{ label: '확인', cls: 'pri', value: 1 }] }); S.cfg = Object.assign(loadCfg(), c, { committed: true, draft: false }); LS.set('smc:cfgDraft', c); location.reload(); }
    catch (e) { toast(e.message, 'bad'); }
  },
  copyRules: () => copy(rulesText(S.cfg.adminEmails), '보안 규칙 복사'),
  saveToken: async () => {
    const v = $('#s_tok').value.trim(); if (!v || v.startsWith('•')) return toast('토큰을 붙여 넣으세요', 'bad');
    LS.set('smc:ghToken', v);
    try { const me = await gh('/user'); await gh(`/repos/${OWNER}/${SELF}`); toast(`✅ ${me.login} 토큰 확인`, 'ok'); loadRepos(true); render(); }
    catch (e) { LS.del('smc:ghToken'); toast('토큰 확인 실패: ' + e.message, 'bad'); }
  },
  delToken: () => { LS.del('smc:ghToken'); toast('토큰 삭제'); render(); },
  guardAll: () => guardBulk(pagesSites().map(s => s.id)), unguardAll: () => guardBulk(pagesSites().map(s => s.id), true),
  backup: () => download(`site_main_control_backup_${today()}.json`, JSON.stringify({ exportedAt: new Date().toISOString(), sites: S.sites, users: S.users, groups: S.groups, orgs: S.orgs, packages: S.cpkgs }, (k, v) => (v && typeof v === 'object' && 'seconds' in v && 'nanoseconds' in v) ? new Date(v.seconds * 1000).toISOString() : v, 2), 'application/json'),
  resetLocal: () => { ['smc:repos', 'smc:checks'].forEach(LS.del); location.reload(); },
  pickAll: el => { const pk = el.closest('.picker'); $$('label.pi', pk).filter(l => l.style.display !== 'none').forEach(l => l.querySelector('input').checked = true); updatePickCount(el.closest('.modal-bg') || document, el.dataset.n); },
  pickNone: el => { const pk = el.closest('.picker'); $$('input', pk).forEach(i => i.checked = false); updatePickCount(el.closest('.modal-bg') || document, el.dataset.n); },
  pickCat: el => { const pk = el.closest('.picker'); const boxes = $$(`label.pi[data-pc="${el.dataset.c}"] input`, pk); const all = boxes.every(b => b.checked); boxes.forEach(b => b.checked = !all); updatePickCount(el.closest('.modal-bg') || document, el.dataset.n); }
};
function extendDate(base, months) { const b = base && base > today() ? base : today(); const d = new Date(b + 'T12:00:00'); d.setMonth(d.getMonth() + months); return d.toLocaleDateString('sv-SE'); }
async function orgBulk(el, kind) {
  const v = el.value; el.value = ''; if (!v || !needAdmin()) return;
  const ids = [...S.osel]; let ops = [], msg = '';
  if (kind === 'pkgAdd' || kind === 'pkgDel') {
    const p = pkgById(v); if (!(await confirmBox(`선택한 ${ids.length}곳에 <b>${esc(pkgLabel(p))}</b> 패키지를 ${kind === 'pkgAdd' ? '<b>승인</b>' : '<b>회수</b>'}할까요?`, kind === 'pkgAdd' ? '승인' : '회수', kind === 'pkgAdd' ? 'pri' : 'bad'))) return;
    ops = ids.map(id => ['orgs', id, grantPatch(S.orgs[id], { packages: [v] }, kind === 'pkgAdd' ? 'add' : 'remove')]); msg = `${ids.length}곳 ${kind === 'pkgAdd' ? '승인' : '회수'}: ${pkgLabel(p)}`;
  } else if (kind === 'extend') { ops = ids.map(id => ['orgs', id, { expiresAt: extendDate(S.orgs[id].expiresAt, +v) }]); msg = `${ids.length}곳 기간 +${v}개월`; }
  else if (kind === 'status') { ops = ids.map(id => ['orgs', id, { status: v }]); msg = `${ids.length}곳 상태 변경`; }
  await commitOps(ops); toast('✅ ' + msg, 'ok');
}
function readSetupForm(silent) {
  const fb = parseFbConfig($('#s_fb').value || '');
  if (!fb) { if (!silent) toast('firebaseConfig를 인식하지 못했어요. Firebase에서 복사한 코드를 그대로 붙여 넣으세요', 'bad'); return null; }
  const admins = parseEmails($('#s_admins').value);
  if (!admins.length) { if (!silent) toast('관리자 이메일을 입력하세요', 'bad'); return null; }
  return { owner: OWNER, firebase: fb, adminEmails: admins, options: { defaultMode: $('#s_def').value, logging: $('#s_log').checked, trackPublic: $('#s_pub').checked, showBadge: $('#s_badge').checked } };
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.closest('.modal-bg') && !['pickAll', 'pickNone', 'pickCat'].includes(el.dataset.act)) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(el, e)).catch(err => toast(err.message || String(err), 'bad')); }
});
$('#scrim').addEventListener('click', closeDrawer);
const CHG = {
  mode: async el => { await setMode([el.dataset.id], el.value); },
  bulkMode: async el => { if (!el.value) return; const ok = await confirmBox(`선택한 ${S.sel.size}개 사이트를 <b>${MODES[el.value].ico} ${MODES[el.value].label}</b>(으)로 바꿀까요?`); if (ok) { await setMode([...S.sel], el.value); S.sel.clear(); } el.value = ''; render(); },
  bulkGroup: async el => { if (!el.value || !needAdmin()) return; await fx().updateDoc(dref('groups', el.value), { sites: fx().arrayUnion(...S.sel) }); toast(`${S.groups[el.value].name}에 ${S.sel.size}개 사이트 추가`, 'ok'); el.value = ''; },
  fcat: el => { S.f.cat = el.value; render(); }, fmode: el => { S.f.mode = el.value; render(); }, fguard: el => { S.f.guard = el.value; render(); }, fsort: el => { S.f.sort = el.value; render(); }, fall: el => { S.f.all = el.checked; render(); },
  ugroup: el => { S.uf.group = el.value; render(); }, ustatus: el => { S.uf.status = el.value; render(); },
  ldays: el => loadLogs(+el.value), lsite: el => { S.lf.site = el.value; render(); }, lresult: el => { S.lf.result = el.value; render(); },
  reqGroup: el => { if (el.value) approveRequest(el.dataset.id, el.value); },
  reqOrg: el => { if (el.value) approveRequest(el.dataset.id, null, el.value); },
  uorg: el => { S.uf.org = el.value; render(); },
  ostatus: el => { S.of.status = el.value; render(); }, otype: el => { S.of.type = el.value; render(); },
  obulkPkg: el => orgBulk(el, 'pkgAdd'), obulkPkgDel: el => orgBulk(el, 'pkgDel'), obulkExtend: el => orgBulk(el, 'extend'), obulkStatus: el => orgBulk(el, 'status'),
  restore: async el => {
    const file = el.files[0]; if (!file || !needAdmin()) return;
    try {
      const data = JSON.parse(await file.text()); if (!(await confirmBox(`백업을 복원할까요? 사이트 ${Object.keys(data.sites || {}).length} · 회원 ${Object.keys(data.users || {}).length} · 그룹 ${Object.keys(data.groups || {}).length}<br><span class="small muted">같은 항목은 덮어써요.</span>`, '복원'))) return;
      const { F, db } = S.fb; const ops = [];
      ['sites', 'users', 'groups', 'orgs', 'packages'].forEach(col => Object.entries(data[col] || {}).forEach(([id, v]) => { const c = { ...v }; ['createdAt', 'updatedAt', 'lastSeen'].forEach(k => { if (typeof c[k] === 'string') c[k] = F.Timestamp.fromDate(new Date(c[k])); }); ops.push([col, id, c]); }));
      for (let i = 0; i < ops.length; i += 400) { const b = F.writeBatch(db); ops.slice(i, i + 400).forEach(([col, id, v]) => b.set(F.doc(db, col, id), v, { merge: true })); await b.commit(); }
      toast(`✅ ${ops.length}개 항목 복원`, 'ok');
    } catch (e) { toast('복원 실패: ' + e.message, 'bad'); }
    el.value = '';
  }
};
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el || el.closest('.modal-bg')) return;
  const fn = CHG[el.dataset.chg]; if (fn) Promise.resolve(fn(el, e)).catch(err => toast(err.message || String(err), 'bad'));
});
let inT;
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k) return;
  clearTimeout(inT); inT = setTimeout(() => { if (k === 'sq') S.f.q = el.value; if (k === 'uq') S.uf.q = el.value; if (k === 'lq') S.lf.q = el.value; if (k === 'oq') S.of.q = el.value; if (k === 'pq') S.pq = el.value; render(); }, 120);
});
let gKey = 0;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalRoot').children.length) return; closeDrawer(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { const s = $('#sq,#uq,#lq'); if (s) { e.preventDefault(); s.focus(); } else { go('sites'); setTimeout(() => $('#sq') && $('#sq').focus(), 80); e.preventDefault(); } return; }
  if (e.key === 'g') { gKey = Date.now(); return; }
  if (Date.now() - gKey < 800) { const m = { d: 'dashboard', s: 'sites', u: 'users', r: 'requests', l: 'logs', p: 'groups' }[e.key]; if (m) go(m); gKey = 0; }
});

/* ---------------- 시작 ---------------- */
renderNav(); renderTop(); render();
loadRepos().then(() => {
  const stale = pagesSites().filter(s => !S.checks[s.id] || Date.now() - (S.checks[s.id].t || 0) > 6 * 3600e3);
  if (stale.length && stale.length <= 200) runChecks(stale.map(s => S.repos.find(r => r.id === s.id)));
});
initFirebase();
</script>
</body>
